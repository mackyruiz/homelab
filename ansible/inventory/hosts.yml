---
all:
  vars:
    ansible_user: labadmin
  hosts:
    server1:
      ansible_host: server1.example.com
  children:
    proxmox_vms:
      hosts:
        labtest: {} # ansible_host passed via -e from `terraform output -raw labtest_ipv4`
      children:
        yarr:
          hosts:
            yarr_vm:
              ansible_host: 10.0.0.160
        identity:
          children:
            freeipa_servers:
              hosts:
                freeipa:
                  ansible_host: 10.0.0.31
            authentik_servers:
              hosts:
                authentik:
                  ansible_host: 10.0.0.32
            vaultwarden_servers:
              hosts:
                vaultwarden:
                  ansible_host: 10.0.0.33
            caddy_servers:
              hosts:
                caddy:
                  ansible_host: 10.0.0.34
    dns_servers:
      hosts:
        nas:
          ansible_host: 10.0.0.225
    gitea_servers:
      hosts:
        nas: {}
    pis:
      hosts:
        k3s-1:
          ansible_host: k3s-1.example.com
          ipa_client_fqdn: k3s-1.example.com
        k3s-2:
          ansible_host: k3s-2.example.com
        k3s-3:
          ansible_host: k3s-3.example.com
        k3s-4:
          ansible_host: k3s-4.example.com
    ipa_clients:
      children:
        authentik_servers: {}
        vaultwarden_servers: {}
        caddy_servers: {}
        pis: {}
