---
k3s_version: "v1.36.5+k3s1"
k3s_gateway: 10.0.0.1
k3s_nm_connection: "Wired connection 1"
k3s_server_fqdn: k3s-1.example.com
k3s_server_url: "https://{{ hostvars[groups['k3s_server'][0]].k3s_node_ip }}:6443"
backup_name: k3s
backup_dest: /mnt/pishare/k3s-backups
backup_requires_mount: /mnt/pishare
backup_after: k3s.service
backup_packages: [sqlite3, age]
backup_steps:
  - sqlite3 /var/lib/rancher/k3s/server/db/state.db ".backup '$work/state.db'"
  - cp /var/lib/rancher/k3s/server/token "$work/token"
