---
# The router's IPv6 RA advertises a resolver that answers NXDOMAIN for the
# internal records, so send the internal domain to the lab DNS server only.
- name: Ensure the resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

- name: Route the internal domain to the lab DNS server
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/internal-domain.conf
    content: |
      [Resolve]
      DNS={{ internal_dns_server }}
      Domains=~{{ internal_dns_domain }}
    mode: "0644"
  register: internal_dns

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: internal_dns.changed
