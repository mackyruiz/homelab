---
- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# CoreDNS forwards to a random upstream from resolv-conf; listing only nas
# keeps split-horizon names such as gitea.example.com resolvable from pods.
- name: Set the resolv.conf K3s hands to pods
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    content: "nameserver {{ internal_dns_server }}\n"
    mode: "0644"
  notify: Restart k3s

- name: Write the K3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  diff: false
  notify: Restart k3s

- name: Read the installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    force: true
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout

- name: Install K3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ 'server' if inventory_hostname in groups['k3s_server'] else 'agent' }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout

- name: Enable and start K3s
  ansible.builtin.service:
    name: "{{ k3s_service }}"
    enabled: true
    state: started
