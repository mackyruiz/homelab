---
- name: Create Vaultwarden directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ vaultwarden_dir }}"
    - "{{ vaultwarden_dir }}/data"

- name: Render Vaultwarden environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vaultwarden_dir }}/.env"
    mode: "0600"
  diff: false

- name: Render Vaultwarden compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start Vaultwarden
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    project_name: vaultwarden
    state: present

- name: Wait for Vaultwarden
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vaultwarden_http_port }}/alive"
    status_code: 200
  register: vaultwarden_alive
  until: vaultwarden_alive.status == 200
  retries: 30
  delay: 5
