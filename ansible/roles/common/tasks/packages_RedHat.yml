---
- name: Enable EPEL (fail2ban)
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - gnupg2
      - firewalld
      - dnf-automatic
      - fail2ban
      - qemu-guest-agent
      - acl
      - python3-libselinux
    state: present
